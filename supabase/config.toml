project_id = "pvesofbrctfipdyqyloq"
# ── Edge functions que NÃO recebem JWT do Supabase (a CLI aplica no deploy) ──
# Webhook do Asaas e robôs chamados pelo cron só com x-robot-secret; o callback
# do Google chega sem sessão (o redirect do Google não traz login) e google-sync
# aceita robô OU usuário. Cada uma valida o próprio segredo no código.
# As demais exigem JWT (usuário logado ou service role do cron/robôs).
[functions.asaas-webhook]
verify_jwt = false
[functions.asaas-reconcile]
verify_jwt = false
[functions.trial-reminder]
verify_jwt = false
[functions.google-sync]
verify_jwt = false
[functions.google-oauth-callback]
verify_jwt = false
[functions.zap-bridge]
verify_jwt = false

# Templates dos e-mails de autenticação (em português, com a marca VextriaHub).
# Valem para o `supabase start` local; no projeto hospedado, colar o conteúdo em
# Authentication → Email Templates (assuntos em scripts/migracao-supabase/README.md).
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no VextriaHub"
content_path = "./supabase/templates/confirmacao.html"

[auth.email.template.recovery]
subject = "Redefinir sua senha do VextriaHub"
content_path = "./supabase/templates/recuperacao.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao VextriaHub"
content_path = "./supabase/templates/link-magico.html"

[auth.email.template.email_change]
subject = "Confirme a troca de e-mail no VextriaHub"
content_path = "./supabase/templates/troca-de-email.html"

[auth.email.template.invite]
subject = "Você foi convidado para o VextriaHub"
content_path = "./supabase/templates/convite.html"

[auth.email.template.reauthentication]
subject = "Seu código de confirmação do VextriaHub"
content_path = "./supabase/templates/reautenticacao.html"

# Notion por escritório: o callback é validado pelo `state` (o redirect do Notion
# não traz sessão) e o sync aceita x-robot-secret (cron) ou JWT checado no código.
[functions.notion-oauth-callback]
verify_jwt = false

[functions.notion-sync]
verify_jwt = false
[functions.juris-sync]
verify_jwt = false
