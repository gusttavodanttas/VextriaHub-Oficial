# Vigia de regressão: roda a cada push/PR no main.
# Se o type-check, os testes ou o build quebrarem, o commit fica marcado com X
# no GitHub — o problema aparece AQUI antes de aparecer na tela de um usuário.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint — falha só em erros; warnings não quebram)
        run: npx eslint . --quiet

      - name: Catraca de warnings (o 'any' não pode crescer além do teto)
        # Trava o débito de qualidade: se os warnings de lint (majoritariamente
        # no-explicit-any) passarem de 700, a CI falha — obriga a não adicionar
        # 'any' novo sem limpar outro. Conta via JSON (sem despejar 700 linhas).
        # Teto baixado de 720→700 em set/2026: 31 'any' removidos (a maioria
        # onError de useMutation, que o TanStack Query já tipa como Error por
        # padrão — bastava tirar a anotação); ficam 689 hoje, os 11 de folga
        # são pra não travar uma PR não relacionada por 1 warning incidental.
        run: |
          W=$(npx eslint . -f json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(String(JSON.parse(d).reduce((s,f)=>s+f.warningCount,0))))")
          echo "eslint warnings: $W (teto 700)"
          test "$W" -le 700 || { echo "::error::warnings de lint passaram de 700 ($W) — evite adicionar 'any' novo (ou limpe outros para compensar)"; exit 1; }

      - name: Type-check (tsc)
        # -p tsconfig.app.json é obrigatório: `tsc --noEmit` puro usa o tsconfig.json
        # raiz (files:[] + references) e NÃO checa nada em src. Este aponta pro projeto real.
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Testes (vitest)
        run: npx vitest run

      - name: Build de produção (vite)
        run: npx vite build
