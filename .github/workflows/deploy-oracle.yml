# Deploy automático do front do VextriaHub no servidor Oracle (servido pelo Caddy).
# Dispara a cada push na main — e dá pra rodar na mão em Actions → "Run workflow".
# Builda o Vite e envia o dist/ por rsync/SSH pro servidor (147.15.10.89).
#
# ── Secrets necessários (repo → Settings → Secrets and variables → Actions → New secret):
#   VITE_SUPABASE_ANON_KEY  → a chave anon (Supabase → Project Settings → API → "anon public")
#   ORACLE_SSH_KEY          → a CHAVE PRIVADA SSH do servidor (conteúdo do arquivo .pem/id_rsa,
#                             a mesma que você usa pra entrar no Oracle; cole o texto inteiro)
#
# Enquanto esses 2 secrets não existirem, o workflow vai falhar (vermelho) — é esperado.
name: Deploy VextriaHub (Oracle)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Nunca dois deploys ao mesmo tempo; se vier push novo, cancela o anterior.
concurrency:
  group: deploy-oracle
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Não publica código que não compila (mesmo -p do CI: aponta pro projeto real em src)
      - name: Type-check (tsc)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mzhnlhfxfoigkqgxseeu.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Enviar dist/ para o Oracle (rsync via SSH)
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 147.15.10.89 >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            dist/ ubuntu@147.15.10.89:/home/ubuntu/vextriahub-site/
