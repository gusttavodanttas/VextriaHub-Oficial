# Apaga UMA edge function do projeto Supabase pela CLI oficial — para
# functions temporárias/legadas que não existem em supabase/functions/
# (ex.: `restaurar-storage`, usada uma vez na migração de 09/10/2026).
#
# Roda só na mão: Actions → "Apagar Edge Function (Supabase)" → Run workflow →
# nome da function. Recusa apagar qualquer function que exista no repositório
# (essas são publicadas pelo deploy-functions.yml e voltariam no próximo deploy).
# Usa o mesmo secret SUPABASE_ACCESS_TOKEN do deploy-functions.yml.
name: Apagar Edge Function (Supabase)

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nome (slug) da function a apagar — precisa NÃO existir em supabase/functions/"
        required: true
        type: string

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir token e nome
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado."
            exit 1
          fi
          if ! printf '%s' "$NAME" | grep -Eq '^[a-z0-9-]{1,64}$'; then
            echo "::error::Nome inválido: '$NAME' (use só letras minúsculas, números e hífen)."
            exit 1
          fi
          if [ -d "supabase/functions/$NAME" ]; then
            echo "::error::'$NAME' existe em supabase/functions/ — é publicada pelo deploy; remova do repositório primeiro."
            exit 1
          fi

      - name: Apagar a function
        run: |
          REF="${{ vars.SUPABASE_PROJECT_REF }}"
          [ -n "$REF" ] || REF="$(sed -nE 's/^project_id = "([a-z]+)"/\1/p' supabase/config.toml)"
          echo "Projeto: $REF — apagando '$NAME'"
          supabase functions delete "$NAME" --project-ref "$REF"

      - name: Listar functions restantes
        run: |
          REF="${{ vars.SUPABASE_PROJECT_REF }}"
          [ -n "$REF" ] || REF="$(sed -nE 's/^project_id = "([a-z]+)"/\1/p' supabase/config.toml)"
          supabase functions list --project-ref "$REF"
