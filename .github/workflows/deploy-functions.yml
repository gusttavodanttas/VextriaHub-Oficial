# Publica as edge functions de supabase/functions/ no projeto Supabase, com a CLI
# oficial — o código vai exatamente como está no repositório.
#
# Roda na mão (Actions → "Deploy Edge Functions (Supabase)" → Run workflow) e
# automaticamente quando um merge na main altera supabase/functions/**.
#
# ── Secret necessário (repo → Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN → token pessoal gerado em https://supabase.com/dashboard/account/tokens
# ── Variável (aba Variables):
#   SUPABASE_PROJECT_REF  → ref do projeto (ex.: pvesofbrctfipdyqyloq). Sem ela,
#                           usa o project_id de supabase/config.toml.
#
# Quais functions dispensam JWT (webhook do Asaas, robôs chamados pelo cron) fica
# em supabase/config.toml ([functions.<nome>] verify_jwt = false) — a CLI aplica.
# Os SEGREDOS das functions (Asaas, Google, Resend, OpenAI…) não passam por aqui:
# Dashboard → Edge Functions → Manage secrets (ou `supabase secrets set`).
name: Deploy Edge Functions (Supabase)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado (ver cabeçalho deste workflow)."
            exit 1
          fi

      - name: Publicar todas as functions
        run: |
          REF="${{ vars.SUPABASE_PROJECT_REF }}"
          if [ -z "$REF" ]; then
            REF="$(sed -nE 's/^project_id = "([a-z]+)"/\1/p' supabase/config.toml)"
          fi
          echo "Projeto: $REF"
          supabase functions deploy --project-ref "$REF"

      - name: Listar functions publicadas
        run: |
          REF="${{ vars.SUPABASE_PROJECT_REF }}"
          [ -n "$REF" ] || REF="$(sed -nE 's/^project_id = "([a-z]+)"/\1/p' supabase/config.toml)"
          supabase functions list --project-ref "$REF"
